services:
  postgres:
    image: postgres:16
    container_name: library-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-library}
      POSTGRES_DB: ${POSTGRES_DB:-library}
      # Required: supply via environment or a .env file next to this compose file.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (e.g. in build/.env)}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend-code
      dockerfile: Dockerfile
    container_name: library-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "4000"
      DATABASE_URL: postgres://${POSTGRES_USER:-library}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (e.g. in build/.env)}@postgres:5432/${POSTGRES_DB:-library}
      # Required: signing key for JWTs. No fallback is provided on purpose.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (e.g. in build/.env)}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend-code
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api/v1}
    container_name: library-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api/v1}
    ports:
      - "5173:5173"

volumes:
  postgres-data: